name: Publish release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag
        required: true
        type: string
      run_id:
        description: Successful build workflow run ID for that tag
        required: true
        type: string
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      BUILD_RUN_ID: ${{ inputs.run_id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify tag and build
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]
          test -f ".github/release-notes/$RELEASE_TAG.md"
          run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID")
          test "$(jq -r .conclusion <<< "$run")" = success
          test "$(jq -r .head_branch <<< "$run")" = "$RELEASE_TAG"
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)
          test "$(jq -r .head_sha <<< "$run")" = "$tag_sha"
      - uses: actions/download-artifact@v4
        with:
          path: downloads
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          cp downloads/SigmaDown-windows-latest/nsis/*.exe release/
          cp downloads/SigmaDown-windows-latest/msi/*.msi release/
          cp downloads/SigmaDown-macos-latest/dmg/*.dmg release/
          cp downloads/SigmaDown-ubuntu-22.04/deb/*.deb release/
          cp downloads/SigmaDown-ubuntu-22.04/appimage/*.AppImage release/
          (cd release && sha256sum SigmaDown* > SHA256SUMS.txt)
          gh release create "$RELEASE_TAG" release/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "SigmaDown $RELEASE_TAG" --notes-file ".github/release-notes/$RELEASE_TAG.md"
