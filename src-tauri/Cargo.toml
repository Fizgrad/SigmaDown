[package]
name = "sigmadown"
version = "0.1.2"
description = "A lightweight offline Markdown reader"
authors = ["SigmaDown contributors"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
